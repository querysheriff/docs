apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "querysheriff.fullname" . }}-migrate
  labels:
    {{- include "querysheriff.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "querysheriff.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: migrate
          image: {{ include "querysheriff.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/querysheriff-migrate"]
          envFrom:
            - secretRef:
                name: {{ include "querysheriff.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
