apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "querysheriff.fullname" . }}-api
  labels:
    {{- include "querysheriff.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    app.kubernetes.io/version: {{ .Values.backend.image.tag | quote }}
spec:
  replicas: {{ .Values.backend.api.replicas }}
  selector:
    matchLabels:
      {{- include "querysheriff.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "querysheriff.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.backend.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: api
          image: {{ include "querysheriff.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "querysheriff.secretName" . }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:3000"
            - name: CORS_ALLOWED_ORIGINS
              value: {{ include "querysheriff.origin" . | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ingress.tls.enabled | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- with .Values.backend.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.backend.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
