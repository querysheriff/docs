# Default values for querysheriff.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix (release name + chart name).
fullnameOverride: ""

image:
  # -- Container registry and org that backend/frontend images are pulled from.
  registry: ghcr.io/querysheriff
  # -- Image pull policy for all containers.
  pullPolicy: IfNotPresent
  # -- Image pull secrets for a private registry.
  pullSecrets: []

secret:
  # -- Specifies whether a secret should be created.
  create: true
  # -- The name of the secret to load environment variables from.
  name: ""
  # -- Values to initialize the Secret with. POSTGRES_URL and CLICKHOUSE_URL are both required.
  values: {}
  #   POSTGRES_URL: postgresql://user:password@host:5432/querysheriff
  #   CLICKHOUSE_URL: clickhouse://user:password@host:9000/querysheriff
  #   RETENTION_DAYS: "30"  # optional, days of ClickHouse data kept (1-365)
  # The chart sets LISTEN_ADDR, CORS_ALLOWED_ORIGINS, COOKIE_SECURE and DASHBOARD_URL from ingress.*.

backend:
  image:
    # -- Backend image repository, appended to image.registry.
    repository: backend
    # -- Backend image tag. Required; backend and frontend release independently.
    tag: ""

  api:
    # -- Number of API replicas.
    replicas: 1

    # -- CPU/memory requests and limits for the api container.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # -- Annotations added to api pods.
    podAnnotations: {}
    # -- Node selector for scheduling api pods.
    nodeSelector: {}
    # -- Tolerations for scheduling api pods.
    tolerations: []
    # -- Affinity rules for scheduling api pods.
    affinity: {}

  jobs:
    # -- CPU/memory requests and limits for the jobs container.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # -- Annotations added to jobs pods.
    podAnnotations: {}
    # -- Node selector for scheduling the jobs pod.
    nodeSelector: {}
    # -- Tolerations for scheduling the jobs pod.
    tolerations: []
    # -- Affinity rules for scheduling the jobs pod.
    affinity: {}

frontend:
  image:
    # -- Frontend image repository, appended to image.registry.
    repository: frontend
    # -- Frontend image tag. Required; backend and frontend release independently.
    tag: ""
  # -- Number of frontend replicas.
  replicas: 1

  # -- CPU/memory requests and limits for the frontend container.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # -- Annotations added to frontend pods.
  podAnnotations: {}
  # -- Node selector for scheduling frontend pods.
  nodeSelector: {}
  # -- Tolerations for scheduling frontend pods.
  tolerations: []
  # -- Affinity rules for scheduling frontend pods.
  affinity: {}

ingress:
  # -- Public hostname serving the dashboard and, under /api, the Connect API. Required.
  host: ""
  # -- IngressClass name (e.g. nginx). Empty uses the cluster default.
  className: ""
  # -- Annotations added to the Ingress (e.g. cert-manager issuer).
  annotations: {}

  tls:
    # -- The site is served over HTTPS.
    enabled: true
    # -- Terminate TLS with this Secret. Leave empty when the controller obtains certificates itself.
    secretName: ""
