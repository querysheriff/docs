{{- if .Values.ingress.enabled }}
{{- $fullname := include "pgdozor.fullname" . }}
{{- $backendSvc := printf "%s-backend" $fullname }}
{{- $frontendSvc := printf "%s-frontend" $fullname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pgdozor.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if .Values.ingress.dualHost.enabled }}
        - {{ .Values.ingress.dualHost.apiHost | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  rules:
    {{- if .Values.ingress.dualHost.enabled }}
    - host: {{ required "ingress.dualHost.apiHost is required in dual-host mode" .Values.ingress.dualHost.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendSvc }}
                port:
                  number: 3000
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontendSvc }}
                port:
                  number: 3000
    {{- else }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.rpcServices }}
          - path: /pgdozor.v1.{{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backendSvc }}
                port:
                  number: 3000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontendSvc }}
                port:
                  number: 3000
    {{- end }}
{{- end }}
