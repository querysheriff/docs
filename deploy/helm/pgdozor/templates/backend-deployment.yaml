apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgdozor.fullname" . }}-backend
  labels:
    {{- include "pgdozor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: {{ .Values.backend.image.tag | quote }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "pgdozor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pgdozor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "pgdozor.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/pgdozor-migrate"]
          envFrom:
            - secretRef:
                name: {{ include "pgdozor.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: backend
          image: {{ include "pgdozor.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "pgdozor.secretName" . }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:3000"
            - name: CORS_ALLOWED_ORIGINS
              value: {{ include "pgdozor.origin" . | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ingress.tls.enabled | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.backend.retentionDays | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
