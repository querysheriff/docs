{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgdozor.fullname" . }}-backend
  labels:
    {{- include "pgdozor.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "Set backend.databaseUrl or backend.existingSecret" .Values.backend.databaseUrl | quote }}
{{- end }}
