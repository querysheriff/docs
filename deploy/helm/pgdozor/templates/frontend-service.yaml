apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgdozor.fullname" . }}-frontend
  labels:
    {{- include "pgdozor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "pgdozor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
