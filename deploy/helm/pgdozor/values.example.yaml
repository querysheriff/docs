# Example production values for the pgdozor Helm chart.
# Copy, edit, and install with:
#   helm install pgdozor ./deploy/helm/pgdozor -f my-values.yaml

image:
  registry: ghcr.io/pgdozor
  # Pin to a released tag in production rather than the chart appVersion default.
  # backend.image.tag / frontend.image.tag override per component.

# The backend's own Postgres store. Point at an EMPTY database whose role can
# CREATE tables and partitions.
secret:
  create: true
  values:
    DATABASE_URL: "postgres://pgdozor:CHANGE_ME@my-postgres:5432/pgdozor?sslmode=require"
  # To use a Secret you created yourself instead of a chart-managed one:
  # create: false
  # name: pgdozor-db

backend:
  cookieSecure: true
  retentionDays: 30
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Single-host mode (recommended): app + Connect API share one origin, so there
# is no CORS and the SameSite=Lax session cookie flows. PUBLIC_API_URL and
# CORS_ALLOWED_ORIGINS are derived from this host automatically.
ingress:
  enabled: true
  className: nginx
  host: pgdozor.example.com
  tls:
    enabled: true
    # secretName: pgdozor-tls   # omit to default to <release>-pgdozor-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  # Dual-host alternative — app on `host`, API on `apiHost`. Both MUST be
  # subdomains of one registrable domain or the session cookie will not flow.
  # dualHost:
  #   enabled: true
  #   apiHost: api.pgdozor.example.com
